name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag (for example, v1.2.3)'
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - id: get-version-tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_MAJOR_VERSION="${RELEASE_VERSION%%.*}"
          remaining_version="${RELEASE_VERSION#*.}"
          RELEASE_MINOR_VERSION="${RELEASE_MAJOR_VERSION}.${remaining_version%%.*}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_MINOR_VERSION=$RELEASE_MINOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_MAJOR_VERSION=$RELEASE_MAJOR_VERSION" >> "$GITHUB_OUTPUT"
    outputs:
      RELEASE_TAG: ${{ steps.get-version-tag.outputs.RELEASE_TAG }}
      RELEASE_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_VERSION }}
      RELEASE_MINOR_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_MINOR_VERSION }}
      RELEASE_MAJOR_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_MAJOR_VERSION }}

  verify:
    name: Run tests
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ needs.version.outputs.RELEASE_TAG }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.0.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --verbosity normal

  release_zip:
    if: ${{ github.repository == 'oahsiao/BaGetter' && (github.ref_type == 'tag' || inputs.tag != '') }}
    needs: [version, verify, release_docker_image]
    name: Release BaGetter.zip to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.RELEASE_TAG }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.0.0
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          dotnet publish src/BaGetter --configuration Release --output artifacts --property:Version=${{ needs.version.outputs.RELEASE_VERSION }}
          echo "${{ github.sha }}" > artifacts/ReleaseSha.txt
          7z a -tzip bagetter-${{ needs.version.outputs.RELEASE_VERSION }}.zip ./artifacts/*
      - name: Download Docker image archives
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images
      - name: Generate changelog with git-cliff
        uses: tj-actions/git-cliff@v2.2.0
        with:
          args: --latest --strip all
          output: CHANGELOG.md
      - name: Create release with ncipollo/release-action
        uses: ncipollo/release-action@v1.14.0
        with:
          bodyFile: CHANGELOG.md
          artifacts: bagetter-${{ needs.version.outputs.RELEASE_VERSION }}.zip,docker-images/*.docker.tar.gz
          name: ${{ needs.version.outputs.RELEASE_VERSION }}
          tag: ${{ needs.version.outputs.RELEASE_TAG }}
          prerelease: ${{ contains(needs.version.outputs.RELEASE_VERSION, '-') }}

  release_docker_image:
    if: ${{ github.repository == 'oahsiao/BaGetter' && (github.ref_type == 'tag' || inputs.tag != '') }}
    needs: [version, verify]
    name: Release Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ needs.version.outputs.RELEASE_TAG }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oahsiao/bagetter
          tags: |
            type=raw,value=${{ needs.version.outputs.RELEASE_VERSION }}
            type=raw,value=${{ needs.version.outputs.RELEASE_MINOR_VERSION }},enable=${{ !contains(needs.version.outputs.RELEASE_VERSION, '-') }}
            type=raw,value=${{ needs.version.outputs.RELEASE_MAJOR_VERSION }},enable=${{ !contains(needs.version.outputs.RELEASE_VERSION, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.RELEASE_VERSION, '-') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            Version=${{ needs.version.outputs.RELEASE_VERSION }}
      - name: Export Docker image archives
        env:
          IMAGE: ghcr.io/oahsiao/bagetter:${{ needs.version.outputs.RELEASE_VERSION }}
          VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p docker-images
          docker pull --platform linux/amd64 "$IMAGE"
          docker image save "$IMAGE" | gzip > "docker-images/bagetter-${VERSION}-linux-amd64.docker.tar.gz"
          docker pull --platform linux/arm64 "$IMAGE"
          docker image save "$IMAGE" | gzip > "docker-images/bagetter-${VERSION}-linux-arm64.docker.tar.gz"
      - name: Upload Docker image archives
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images/*.docker.tar.gz
          if-no-files-found: error
          retention-days: 1